  document.querySelectorAll("#barra [data-p]").forEach((b) => {
    b.onclick = () => { periodo = b.dataset.p; render(); };
  });
  $("#atualizar").onclick = carregar;
  $("#btnCalendario").onclick = () => calAbrirModal();

  const menuExp = $("#menuExp");
  $("#exportar").onclick = (e) => { e.stopPropagation(); menuExp.hidden = !menuExp.hidden; };
  menuExp.onclick = (e) => e.stopPropagation();
  document.addEventListener("click", () => { menuExp.hidden = true; });
  menuExp.querySelectorAll("[data-x]").forEach((b) => {
    b.onclick = () => { menuExp.hidden = true; abrirModalExportacao(b.dataset.x); };
  });

  // ============ PESQUISA DE VEÍCULO ============
  (function () {
    const caixas = [...document.querySelectorAll("#pqChassi input")];
    const card = $("#pqCard");

    // Modo da pesquisa: "placa" (padrão, 7 caracteres, vermelho) ou "chassi" (5 caracteres, verde)
    let modo = "placa";
    const tam = () => (modo === "placa" ? 7 : 5);

    const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    const limpo = (t) => t.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    const termo = () => caixas.slice(0, tam()).map((c) => c.value).join("");
    const dataDe = (dia) => { const [a, m, d] = dia.split("-").map(Number); return new Date(a, m - 1, d); };

    function mostrar(htmlTexto) {
      const r = $("#pqRes");
      r.hidden = false;
      r.innerHTML = htmlTexto;
    }

    // Define a cor do cartão: sem resultado usa a cor do modo (vermelho/verde);
    // com resultado usa a cor do tipo do veículo encontrado.
    function definirCorPorTipo(tipo) {
      if (!tipo) { card.removeAttribute("data-cor"); return; }
      card.dataset.cor = COR_TIPO[tipo] ? tipo : "outros";
    }

    function pesquisaRender() {
      const t = termo();
      $("#pqLimpar").hidden = t.length === 0;
      caixas.forEach((c) => c.classList.toggle("cheio", !!c.value));
      const res = $("#pqRes");
      definirCorPorTipo(null);

      if (t.length === 0) { res.hidden = true; res.innerHTML = ""; return; }

      if (t.length < 4) {
        mostrar(`<div class="pq-vazio">Digite pelo menos 4 caracteres do chassi ou placa.</div>`);
        return;
      }

      if (!bruto) {
        mostrar(carregando
          ? `<div class="pq-vazio">Carregando dados…</div>`
          : `<div class="pq-erro">${esc(erro || "Não foi possível carregar os dados.")} Use o botão de atualizar no topo.</div>`);
        return;
      }

      const busca = norm(t);
      const lista = [];
      for (const [dia, regs] of Object.entries(bruto.lavagens || {})) {
        for (const [id, r] of Object.entries(regs || {})) {
          if (norm(r.placa).includes(busca)) lista.push({ dia, id, ...r });
        }
      }
      lista.sort((a, b) => (tsEmMs(b.ts) || 0) - (tsEmMs(a.ts) || 0));

      if (!lista.length) {
        mostrar(`<div class="pq-vazio"><b>Nenhum registro encontrado</b>Não há lavagens para ${modo === "placa" ? "a placa" : "o chassi"} ${esc(t)}. Confira os caracteres.</div>`);
        return;
      }

      // A cor segue o tipo da lavagem mais recente encontrada:
      // showroom = azul, test drive = laranja, outros = cinza, carro novo = verde, oficina = vermelho
      definirCorPorTipo(lista[0].tipo);

      const itens = lista.map((r) => {
        const d = dataDe(r.dia);
        const dia = String(d.getDate()).padStart(2, "0");
        const mes = d.toLocaleDateString("pt-BR", { month: "short" }).replace(/\./g, "");
        const tags = [];
        if (r.polimento) tags.push(`<span class="pq-tag dest">Polimento</span>`);
        if (r.foraListagem) tags.push(`<span class="pq-tag dest">Fora da listagem</span>`);
        if (r.substituido) tags.push(`<span class="pq-tag dest">Substituído</span>`);
        const corTipo = COR_TIPO[r.tipo];
        tags.push(corTipo
          ? `<span class="pq-tag" style="background:${corTipo};border-color:transparent;color:#fff">${esc(TIPOS[r.tipo])}</span>`
          : `<span class="pq-tag" style="background:${COR_TIPO.outros};border-color:transparent;color:#fff">${esc(r.tipo || "Outros")}</span>`);
        const cor = EQUIPE[r.nome] || "#64748b";
        return `
          <article class="pq-item">
            <div class="pq-data"><b>${dia}</b><span>${esc(mes)} ${d.getFullYear()}</span></div>
            <div>
              <div class="pq-modelo">${esc(r.carro || "Modelo não registrado")}</div>
              <div class="pq-meta">Cor <b>${esc(r.cor || "não informada")}</b> &nbsp;·&nbsp; Chassi/Placa <b>${esc(r.placa || "-")}</b></div>
              <div class="pq-tags">${tags.join("")}</div>
            </div>
            <div class="pq-lav">
              <span class="avatar" style="--cor:${cor}">${esc((r.nome || "?").charAt(0))}</span>
              <div><span class="quem">${esc(r.nome || "Desconhecido")}</span><span class="hr">${esc(hora(r.ts))}</span></div>
            </div>
          </article>`;
      }).join("");

      mostrar(`
        <div class="pq-stats">
          <div class="pq-stat"><small>Lavagens</small><b>${lista.length}</b></div>
          <div class="pq-stat"><small>Última lavagem</small><b>${brData(lista[0].dia)}</b></div>
          <div class="pq-stat"><small>${modo === "placa" ? "Placa" : "Chassi"}</small><b>${esc(t)}</b></div>
        </div>
        <div class="pq-lista">${itens}</div>`);
    }
    window.pesquisaRender = pesquisaRender;

    // Aplica o modo atual: mostra 7 campos (placa) ou 5 (chassi), troca textos e cor
    function aplicarModo() {
      const n = tam();
      card.dataset.modo = modo;
      $("#pqSwitch").setAttribute("aria-checked", modo === "chassi" ? "true" : "false");
      document.querySelectorAll("#pqModo .pq-opt").forEach((o) => o.classList.toggle("on", o.dataset.m === modo));
      $("#pqRot").textContent = modo === "placa" ? "Placa (7 caracteres)" : "Chassi (5 caracteres)";
      caixas.forEach((c, i) => {
        c.hidden = i >= n;
        if (i >= n) c.value = "";
      });
      pesquisaRender();
    }

    function alternar(novo) {
      modo = novo || (modo === "placa" ? "chassi" : "placa");
      aplicarModo();
      const vazia = caixas.find((c, i) => i < tam() && !c.value);
      (vazia || caixas[tam() - 1]).focus();
    }

    function preencher(inicio, texto) {
      const l = limpo(texto);
      if (!l) return;
      // Ao colar um texto maior que o campo (ex.: chassi de 17 caracteres), usa só os últimos caracteres
      const dados = l.length > tam() && inicio === 0 ? l.slice(-tam()) : l;
      for (let k = 0; k < dados.length && inicio + k < tam(); k++) caixas[inicio + k].value = dados[k];
      caixas[Math.min(inicio + dados.length, tam() - 1)].focus();
      pesquisaRender();
    }

    caixas.forEach((c, i) => {
      c.addEventListener("input", () => {
        const v = limpo(c.value);
        c.value = "";
        if (v) preencher(i, v); else pesquisaRender();
      });
      c.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !c.value && i > 0) { caixas[i - 1].value = ""; caixas[i - 1].focus(); pesquisaRender(); e.preventDefault(); }
        else if (e.key === "ArrowLeft" && i > 0) caixas[i - 1].focus();
        else if (e.key === "ArrowRight" && i < tam() - 1) caixas[i + 1].focus();
      });
      c.addEventListener("paste", (e) => {
        e.preventDefault();
        preencher(i, (e.clipboardData || window.clipboardData).getData("text"));
      });
      c.addEventListener("focus", () => c.select());
    });

    $("#pqLimpar").onclick = () => { caixas.forEach((c) => { c.value = ""; }); caixas[0].focus(); pesquisaRender(); };
    $("#pqSwitch").onclick = () => alternar();
    document.querySelectorAll("#pqModo .pq-opt").forEach((o) => { o.onclick = () => alternar(o.dataset.m); });

    aplicarModo();
  })();

  // =========================================================
  // CALENDÁRIO DE MÉDIAS (em modal, reaproveita bruto.lavagens)
  // =========================================================
  let calTela = "calendario";
  let calDiaSel = null;

  function calModalAberto() {
    const m = document.getElementById("calModal");
    return m && !m.hidden;
  }
  function calAbrirModal() {
    const m = document.getElementById("calModal");
    if (!m) return;
    calTela = "calendario";
    calDiaSel = null;
    m.hidden = false;
    calRender();
  }
  function calFecharModal() {
    const m = document.getElementById("calModal");
    if (!m) return;
    m.hidden = true;
  }

  function calFmtDuracao(ms) {
    if (!ms || ms < 0) return "—";
    const totalMin = Math.floor(ms / 60000);
    const horas = Math.floor(totalMin / 60);
    const min = totalMin % 60;
    if (horas === 0) return `${min} min`;
    if (min === 0) return `${horas}h`;
    return `${horas}h ${min}min`;
  }

  function calDiaTemDados(dia) {
    if (!bruto || !bruto.lavagens || !bruto.lavagens[dia]) return false;
    return Object.values(bruto.lavagens[dia]).some(r => EQUIPE[r.nome]);
  }

  function calDadosDoDia(dia) {
    if (!bruto || !bruto.lavagens || !bruto.lavagens[dia]) return [];
    const pessoasDoDia = {};
    for (const r of Object.values(bruto.lavagens[dia])) {
      if (!EQUIPE[r.nome]) continue;
      const ms = tsEmMs(r.ts);
      if (ms === null) continue;
      if (!pessoasDoDia[r.nome]) {
        pessoasDoDia[r.nome] = { registros: [], nome: r.nome, cor: EQUIPE[r.nome] };
      }
      pessoasDoDia[r.nome].registros.push({ ts: ms });
    }
    const resultadoDia = [];
    Object.values(pessoasDoDia).forEach(p => {
      p.registros.sort((a, b) => a.ts - b.ts);
      const totalCarros = p.registros.length;
      const primeiro = p.registros[0];
      const ultimo = p.registros[totalCarros - 1];
      let mediaMs = 0;
      if (totalCarros > 1) {
        const tempoTotal = ultimo.ts - primeiro.ts;
        mediaMs = tempoTotal / totalCarros;
      }
      resultadoDia.push({
        nome: p.nome,
        cor: p.cor,
        totalCarros,
        primeiro,
        ultimo,
        mediaMs
      });
    });
    resultadoDia.sort((a, b) => b.totalCarros - a.totalCarros);
    return resultadoDia;
  }

  function calRender() {
    const alvo = document.getElementById("calConteudo");
    if (!alvo) return;

    if (carregando && !bruto) {
      alvo.innerHTML = `<div class="cal-msg">Carregando dados…</div>`;
      return;
    }
    if (!bruto) {
      alvo.innerHTML = `<div class="cal-msg">Os dados do painel ainda não foram carregados. Use o botão de atualizar no topo.</div>`;
      return;
    }

    if (calTela === "detalhe" && calDiaSel) {
      const pessoas = calDadosDoDia(calDiaSel);
      if (!pessoas.length) {
        alvo.innerHTML = `<div class="cal-msg">Nenhum registro de equipe neste dia.</div>`;
        return;
      }
      const cards = pessoas.map(p => {
        const textoMedia = p.totalCarros > 1 ? calFmtDuracao(p.mediaMs) : "—";
        return `
          <div class="cal-card-pessoa" style="--cor:${p.cor}">
            <div class="cal-avatar">${p.nome.charAt(0)}</div>
            <h3>${p.nome}</h3>
            <div class="cal-destaque-media">
              <div class="cal-texto">Média de tempo para lavar um carro neste dia</div>
              <div class="cal-valor">${textoMedia}</div>
            </div>
            <div class="cal-lista-dados">
              <div class="cal-dado-linha">
                <span class="cal-rotulo">Carros lavados</span>
                <span class="cal-valor">${p.totalCarros}</span>
              </div>
              <div class="cal-dado-linha">
                <span class="cal-rotulo">Primeiro carro</span>
                <span class="cal-valor">${hora(p.primeiro.ts)}</span>
              </div>
              <div class="cal-dado-linha">
                <span class="cal-rotulo">Último carro</span>
                <span class="cal-valor">${hora(p.ultimo.ts)}</span>
              </div>
            </div>
          </div>`;
      }).join("");

      alvo.innerHTML = `
        <div class="cal-tela">
          <div class="cal-header">
            <h3>${fmtDataLonga(calDiaSel)}</h3>
            <button id="calVoltarCal">Voltar ao calendário</button>
          </div>
          <div class="cal-grid-cards">${cards}</div>
        </div>`;
      document.getElementById("calVoltarCal").onclick = () => {
        calTela = "calendario";
        calDiaSel = null;
        calRender();
      };
      return;
    }

    const agora = baseOperacional();

    const ano = agora.getFullYear();
    const mes = agora.getMonth();
    const nomeMes = agora.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const primeiroDiaMes = new Date(ano, mes, 1);
    const ultimoDiaMes = new Date(ano, mes + 1, 0);
    const diasDaSemana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

    let celulas = "";
    for (let i = 0; i < primeiroDiaMes.getDay(); i++) {
      celulas += `<div></div>`;
    }
    for (let d = 1; d <= ultimoDiaMes.getDate(); d++) {
      const dataObj = new Date(ano, mes, d);
      const dataIso = iso(dataObj);
      const temDados = calDiaTemDados(dataIso);
      let qtdCarros = 0;
      if (temDados) {
        qtdCarros = Object.values(bruto.lavagens[dataIso]).filter(r => EQUIPE[r.nome]).length;
      }
      if (temDados) {
        celulas += `
          <button class="cal-btn-dia cal-tem-dados" data-dia="${dataIso}">
            ${d}
            <span class="cal-qtd-carros">${qtdCarros} carro${qtdCarros === 1 ? "" : "s"}</span>
          </button>`;
      } else {
        celulas += `<div class="cal-btn-dia cal-vazio">${d}</div>`;
      }
    }

    alvo.innerHTML = `
      <div class="cal-tela">
        <div class="cal-header">
          <h3>${nomeMes}</h3>
        </div>
        <div class="cal-grid">
          ${diasDaSemana.map(ds => `<div class="cal-dia-semana">${ds}</div>`).join("")}
          ${celulas}
        </div>
      </div>`;

    alvo.querySelectorAll(".cal-btn-dia.cal-tem-dados").forEach(btn => {
      btn.onclick = () => {
        calDiaSel = btn.dataset.dia;
        calTela = "detalhe";
        calRender();
      };
    });
  }

  document.getElementById("calFechar").onclick = calFecharModal;
  document.getElementById("calModal").addEventListener("click", (e) => {
    if (e.target.id === "calModal") calFecharModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && calModalAberto()) calFecharModal();
  });

  carregar();

  let diaAtualVisivel = hojeOperacional();
  setInterval(() => {
    const novoDia = hojeOperacional();
    if (novoDia !== diaAtualVisivel) {
      diaAtualVisivel = novoDia;
      carregar();
    }
  }, 60000);
</script>
</body>
</html>
